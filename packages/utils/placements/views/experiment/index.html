<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>placements | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <canvas id="map"></canvas>
    <aside>
        <h1>placements</h1>
        <label>count <input id="count" type="range" min="10" max="5000" step="10" value="500" /><span></span></label>
        <label>seed <input id="seed" type="number" value="1" /></label>
        <p>click a dot: remove it (a change). "regenerate" rebuilds the source and replays the changes.</p>
        <button id="regen" type="button">regenerate</button>
        <output id="info"></output>
    </aside>
</body>

</html>
