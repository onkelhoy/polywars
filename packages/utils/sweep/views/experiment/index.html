<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sweep | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-gallery location=""></pw-gallery>
    <aside>
        <h1>sweep</h1>
        <fieldset>
            <legend>curve</legend>
            <label>seed <input id="seed" type="number" value="1" /></label>
            <label>length <input id="length" type="range" min="20" max="300" step="5" value="120" /><span></span></label>
            <label>curvy <input id="curvy" type="range" min="0" max="1" step=".05" value=".5" /><span></span></label>
            <label>hills <input id="hills" type="range" min="0" max="20" step=".5" value="6" /><span></span></label>
        </fieldset>
        <fieldset>
            <legend>sweep</legend>
            <label>width <input id="width" type="range" min="1" max="30" step=".5" value="7" /><span></span></label>
            <label>bank max ° <input id="bank" type="range" min="0" max="15" step=".5" value="3" /><span></span></label>
            <label>step <input id="step" type="range" min=".5" max="10" step=".5" value="2" /><span></span></label>
            <label>bands <input id="bands" type="range" min="0" max="10" step=".5" value="5" /><span></span></label>
        </fieldset>
        <output id="info"></output>
    </aside>
</body>

</html>
