<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>world | farm</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>
<body>
    <pw-viewport near=".3" far="3000" speed="20">
    <aside>
        <h1>farm</h1>
        <output id="info">growing…</output>
        <label>terrain seed <input id="tseed" type="number" min="0" step="1" value="3" /></label>
        <label>hills m <input id="height" type="range" min="10" max="160" step="5" value="60" /></label>
        <label>farm radius <input id="radius" type="range" min="60" max="220" step="10" value="150" /></label>
        <label>quality <select id="quality"><option>low</option><option selected>medium</option><option>high</option></select></label>
        <div class="row"><button id="top">top</button><button id="yard">yard</button><button id="bench">bench</button></div>
    </aside>
    </pw-viewport>
</body>
</html>
