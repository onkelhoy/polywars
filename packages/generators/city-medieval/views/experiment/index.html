<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>city-medieval | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <aside>
        <h1>city-medieval</h1>
        <form id="settings"></form>
        <label>seed <input id="seed" type="number" min="0" /></label>
        <div class="row"><button id="dice" type="button">🎲 seed</button><button id="generate" type="button">generate</button></div>
        <label>grid <input id="count" type="number" min="1" max="8" value="5" /></label>
        <label>build code <input id="code" /></label>
        <label>kit folder <input id="base" value="/assets/models/buildings/modular-village" /></label>
        <button id="export" type="button" title="every variant shown as &lt;build code&gt;.glb into a folder you pick">export all .glb</button>
        <output id="info"></output>
    </aside>
    <pw-gallery location=""></pw-gallery>
</body>

</html>
