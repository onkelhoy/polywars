<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weapons | guns</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-3d-asset-preview controls grid mode="orbit" animation="idle"></pw-3d-asset-preview>
    <aside>
        <h1>weapons</h1>
        <label>gun <select id="pick"></select></label>
        <div class="row"><button id="fire" type="button">fire (hold)</button><button id="reload" type="button">reload</button><label><input id="aim" type="checkbox" /> aimed</label><label><input id="moving" type="checkbox" /> moving</label></div>
        <output id="info"></output>
        <p>spread at 50 m (circle = 1 m):</p>
        <canvas id="spread" width="240" height="240"></canvas>
    </aside>
</body>

</html>
