<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smoke | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-viewport near=".1" far="3000">
    <aside>
        <h1>smoke</h1>
        <p>Blast in the middle (click or space), campfire left, a moving exhaust, clouds far out.</p>
        <div class="row">
            <button data-burst="blast">blast</button>
            <button data-burst="puff">puff</button>
            <button data-burst="dust">dust</button>
            <button id="clear">clear</button>
        </div>
        <label><input id="repeat" type="checkbox" checked /> repeat blast</label>
        <label>colour <select id="colour"><option value="dust">dust</option><option value="white">white</option><option value="grey">grey</option><option value="dark">dark</option></select></label>
        <label>slow <input id="speed" type="range" min=".05" max="1" step=".05" value="1" /></label>
        <label>scale <input id="scale" type="range" min=".2" max="4" step=".1" value="1" /></label>
        <label>wind <input id="wind" type="range" min="0" max="6" step=".1" value=".6" /></label>
        <label>outline <input id="outline" type="range" min="0" max=".2" step=".01" value=".06" /></label>
        <label>band <input id="band" type="range" min="-.8" max=".8" step=".05" value=".05" /></label>
        <label>sun <input id="sun" type="range" min="0" max="360" step="5" value="40" /></label>
        <label><input id="fire" type="checkbox" checked /> campfire</label>
        <label><input id="exhaust" type="checkbox" checked /> exhaust</label>
        <output id="info"></output>
    </aside>
    </pw-viewport>
</body>

</html>
