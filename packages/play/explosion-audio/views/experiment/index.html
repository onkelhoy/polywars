<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explosion-audio | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-viewport near=".5" far="60000">
    <aside>
        <h1>explosion audio</h1>
        <p>Space: boom. Distance sets the ear (view) out to 40 km: flash first, sound late. Click once to unlock audio.</p>
        <div class="row">
            <button data-power=".2">grenade</button>
            <button data-power="5">shell</button>
            <button data-power="250">bomb</button>
            <button data-power="5000">huge</button>
            <button data-power="100000">massive</button>
        </div>
        <label>power <input id="power" type="range" min="-1" max="5.5" step=".05" value=".7" /> <span id="kg"></span></label>
        <label>distance <input id="distance" type="range" min="1" min="0" max="4.6" step=".05" value="2" /></label>
        <label>slow <input id="speed" type="range" min=".02" max="1" step=".02" value="1" /></label>
        <label>shock <input id="shock" type="range" min="0" max="1" step=".05" value="1" /></label>
        <label>lines <input id="lines" type="range" min="0" max="1" step=".05" value="1" /></label>
        <label><input id="repeat" type="checkbox" /> repeat</label>
        <button id="view">view from distance</button>
        <output id="info"></output>
    </aside>
    </pw-viewport>
    <div id="glare"></div>
</body>

</html>
