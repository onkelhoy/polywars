<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vehicle | drive</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-viewport no-bar near=".1" far="800">
    <aside>
        <h1>vehicle</h1>
        <p>W / S throttle + brake / reverse, A / D steer, Space handbrake, V seat / chase cam, R reset. Bumps, a ramp, crates (solids).</p>
        <label>spring Hz <input id="frequency" type="range" min=".6" max="3" step=".1" value="1.3" /><span></span></label>
        <label>damping <input id="damping" type="range" min=".05" max="1" step=".05" value=".3" /><span></span></label>
        <label>grip <input id="grip" type="range" min=".3" max="2" step=".05" value="1.1" /><span></span></label>
        <output id="info"></output>
    </aside>
    </pw-viewport>
</body>

</html>
