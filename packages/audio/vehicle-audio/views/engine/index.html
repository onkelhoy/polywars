<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vehicle-audio | engine</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>engine</h1>
    <button id="start" type="button">start</button>
    <button id="rev" type="button">rev through 3 gears</button>
    <label>rpm <input id="rpm" type="range" min="700" max="4000" step="10" value="800" /><span></span></label>
    <label>load <input id="load" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
    <label>slip <input id="slip" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
</body>

</html>
