<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather audio</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>
<body>
    <h1>weather audio</h1>
    <button id="start" type="button">start</button>
    <label>rain <input id="rain" type="range" min="0" max="1" step=".01" value=".3" /><span></span></label>
    <label>wind <input id="wind" type="range" min="0" max="1" step=".01" value=".2" /><span></span></label>
    <label>snow <input id="snow" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
    <label>inside <input id="inside" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
    <h2>surfaces</h2>
    <label>ground <input id="ground" type="range" min="0" max="1" step=".01" value="1" /><span></span></label>
    <label>leaves <input id="leaves" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
    <label>roof <input id="roof" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
    <label>water <input id="water" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
    <label>vehicle <input id="vehicle" type="range" min="0" max="1" step=".01" value="0" /><span></span></label>
</body>
</html>
