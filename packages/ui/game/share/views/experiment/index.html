<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.js"></script>
</head>

<body>
    <h1>Share | experiment</h1>
    <section>
        <h2>Host (inline)</h2>
        <pap-codeblock>
            <pw-share code="K7QF2M" link="https://example.com/?g=K7QF2M"></pw-share>
        </pap-codeblock>
    </section>
    <section>
        <h2>Lobby (no link: scan only)</h2>
        <pap-codeblock>
            <pw-share></pw-share>
        </pap-codeblock>
    </section>
    <section>
        <h2>Dialog</h2>
        <button id="open">Open</button>
        <pw-share id="modal" dialog code="K7QF2M" link="https://example.com/?g=K7QF2M"></pw-share>
        <p id="out"></p>
    </section>
</body>

</html>
