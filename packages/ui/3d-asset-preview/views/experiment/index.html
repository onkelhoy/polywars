<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d-asset-preview | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <header>
        <h1>3d-asset-preview</h1>
        <label>asset <select id="pick"></select></label>
        <label>toon <input id="toon" type="range" min="0" max="6" step="1" value="0" /></label>
        <label><input id="grid" type="checkbox" checked /> grid</label>
        <output id="info"></output>
    </header>
    <pw-3d-asset-preview controls grid src="/assets/models/weapons/guns/m1911/model.glb"></pw-3d-asset-preview>
</body>

</html>
