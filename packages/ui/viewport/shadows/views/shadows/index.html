<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadows</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-viewport id="view">
        <aside>
            <h1>shadows</h1>
            <label>texels <input id="size" type="range" min="8" max="12" step="1" value="10" /></label>
            <label>near <input id="near" type="range" min="4" max="40" step="1" value="12" /></label>
            <label>far <input id="far" type="range" min="20" max="150" step="1" value="45" /></label>
            <label>fade <input id="fade" type="range" min="10" max="150" step="1" value="45" /></label>
            <label>strength <input id="strength" type="range" min="0" max="1" step=".05" value=".45" /></label>
            <label>sun <input id="sun" type="range" min="0" max="6.28" step=".01" value="1" /></label>
            <label>toon <input id="toon" type="range" min="0" max="5" step="1" value="3" /></label>
            <output id="values"></output>
        </aside>
    </pw-viewport>
</body>

</html>
