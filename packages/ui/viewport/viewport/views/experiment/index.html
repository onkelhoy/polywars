<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viewport | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-viewport>
        <aside>
            <h1>viewport</h1>
            <p>Typing here never moves the camera.</p>
            <label>name <input value="type WASD here" /></label>
            <label>size <input type="range" min="1" max="4" step=".1" value="1" id="size" /></label>
        </aside>
    </pw-viewport>
</body>

</html>
