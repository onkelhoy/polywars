<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rail | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-gallery location=""></pw-gallery>
    <aside>
        <h1>rail</h1>
        <label>seed <input id="seed" type="number" value="1" /></label>
        <label>length <input id="length" type="range" min="10" max="200" step="5" value="50" /><span></span></label>
        <label>curvy <input id="curvy" type="range" min="0" max="1" step=".05" value=".4" /><span></span></label>
        <label>hills <input id="hills" type="range" min="0" max="10" step=".5" value="2" /><span></span></label>
        <output id="info"></output>
    </aside>
</body>

</html>
