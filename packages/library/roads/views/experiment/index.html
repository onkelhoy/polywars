<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>roads | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <canvas id="map"></canvas>
    <aside>
        <h1>roads</h1>
        <output id="info">generating…</output>
        <fieldset>
            <legend>map</legend>
            <label>terrain seed <input id="tseed" type="number" min="0" step="1" value="42" /></label>
            <label>preset <select id="preset"></select></label>
            <label>quality <select id="quality"><option>low</option><option selected>medium</option><option>high</option></select></label>
            <label>seed <input id="seed" type="number" min="0" step="1" value="1" /></label>
            <label>route cell (m) <input id="cell" type="number" min="4" max="32" step="1" value="8" /></label>
            <label>greed <input id="greed" type="range" min="1" max="3" step=".1" value="1.3" /><span></span></label>
            <label><input id="sites" type="checkbox" checked /> show sites</label>
            <label><input id="eroded" type="checkbox" /> full terrain (carve, erosion, rivers; slow)</label>
        </fieldset>
        <fieldset id="classes">
            <legend>classes (build / show)</legend>
        </fieldset>
        <fieldset>
            <legend>tune class</legend>
            <label>class <select id="tune"></select></label>
            <div id="knobs"></div>
            <button id="rebuild" type="button">rebuild network</button>
        </fieldset>
        <fieldset>
            <legend>click</legend>
            <label>mode <select id="mode"><option value="route">route A → B</option><option value="inspect">inspect site</option></select></label>
            <label>routes <input id="k" type="range" min="1" max="6" step="1" value="4" /><span></span></label>
            <output id="click">click A, then B</output>
        </fieldset>
    </aside>
    <div id="cursor"></div>
</body>

</html>
