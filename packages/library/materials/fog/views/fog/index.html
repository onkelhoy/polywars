<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fog</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-viewport id="view" far="4000">
        <aside>
            <h1>fog</h1>
            <label>density <input id="density" type="range" min="0" max=".005" step=".0001" value=".0009" /></label>
            <label>falloff <input id="falloff" type="range" min="0" max=".1" step=".001" value=".015" /></label>
            <label>base <input id="base" type="range" min="-50" max="100" step="1" value="0" /></label>
            <output id="values"></output>
        </aside>
    </pw-viewport>
</body>

</html>
