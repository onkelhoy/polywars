<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mesh-bake</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <aside>
        <h1>mesh-bake</h1>
        <label class="drop" id="drop">drop a .glb here, or click<input id="file" type="file" accept=".glb" hidden /></label>
        <label>or url <input id="url" placeholder="/assets/models/…/piece.glb" /></label>
        <form id="settings"></form>
        <div class="row"><button id="reset" type="button">reset settings</button></div>
        <h2>download</h2>
        <div class="row" id="downloads"></div>
        <output id="info">no mesh yet</output>
    </aside>
    <main>
        <section id="stage">
            <canvas id="view"></canvas>
            <div class="bar">
                <label>show <select id="show"><option value="baked">baked quad</option><option value="original">original mesh</option><option value="both">both, side by side</option></select></label>
                <label>repeat <input id="repeat" type="number" min="1" max="7" value="3" /></label>
                <label><input id="spin" type="checkbox" checked /> moving light</label>
                <span id="toggles"></span>
                <span class="hint">drag: orbit · wheel: zoom</span>
            </div>
        </section>
        <section id="maps"></section>
    </main>
</body>

</html>
