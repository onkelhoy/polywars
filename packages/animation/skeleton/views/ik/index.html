<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton | IK</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <pw-3d-demo id="view">
        <aside>
            <h1>skeleton · IK on a clip</h1>
            <label>clip <select id="clip"><option value="">rest pose</option></select></label>
            <label><input id="ik" type="checkbox" checked /> IK</label>
            <label>left foot up <input id="foot" type="range" min="0" max="0.5" step="0.01" value="0.2" /></label>
            <label>left step <input id="step" type="range" min="0" max="0.4" step="0.01" value="0" /></label>
            <label>right hand IK <input id="hand" type="range" min="0" max="1" step="0.01" value="0" /></label>
            <small>after the clip, targets move and the chain follows: feet on a step, a hand reaching</small>
        </aside>
    </pw-3d-demo>
</body>

</html>
